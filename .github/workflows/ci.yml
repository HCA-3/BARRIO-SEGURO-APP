name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-ci.txt

      - name: Correr pruebas (fitness functions + backend)
        run: |
          python -m pytest tests/ Agente/tests/ Api/tests/ -v
